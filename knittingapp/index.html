<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Tells the browser to refuse anything that doesn't come from this app's own site. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'">
<title>Row Tracker</title>
<meta name="description" content="Keep your place in a knitting or crochet pattern, row by row.">
<meta name="theme-color" content="#9C3F5D">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="wrap">

  <!-- ============ ADD A PATTERN ============ -->
  <section id="add" class="hidden" aria-labelledby="addTitle">
    <h1 id="addTitle">Row Tracker</h1>
    <p class="muted">Open a pattern file, then tap through it row by row while you knit or crochet.</p>

    <button class="btn btn-primary first" id="openFileBtn" type="button">Open pattern file</button>
    <input type="file" id="fileInput" class="hidden" tabindex="-1" aria-hidden="true"
           accept=".json,application/json,text/plain,.txt,application/pdf,.pdf">

    <div class="status hidden" id="addStatus" role="alert">
      <strong id="addStatusTitle"></strong>
      <ul id="addStatusList"></ul>
    </div>

    <label class="small" for="pasteInput">Paste pattern file</label>
    <textarea id="pasteInput" rows="4" spellcheck="false" autocomplete="off" autocapitalize="off"
              placeholder="Or paste the copied pattern file here."></textarea>
    <button class="btn btn-secondary" id="pasteOpenBtn" type="button">Open</button>

    <div class="links">
      <button class="btn-text" id="helpBtn" type="button">How do I make a pattern file?</button>
      <button class="btn-text" id="counterBtn" type="button">No pattern? Just count rows</button>
    </div>
    <button class="btn btn-secondary hidden" id="backToKnittingBtn" type="button">Back to my knitting</button>
  </section>

  <!-- ============ PICK YOUR SIZE ============ -->
  <section id="size" class="hidden" aria-labelledby="sizeHeading">
    <h1 id="sizeTitle"></h1>
    <p class="muted" id="sizeDesigner"></p>
    <h2 id="sizeHeading">Pick your size</h2>
    <p class="muted hidden" id="sizeNote"></p>
    <div id="sizeList"></div>
    <button class="btn btn-secondary" id="sizeCancelBtn" type="button">Choose a different file</button>
  </section>

  <!-- ============ CHECK IT ============ -->
  <section id="check" class="hidden" aria-labelledby="checkTitle">
    <p class="eyebrow">Check it</p>
    <h1 id="checkTitle"></h1>
    <p class="muted" id="checkSummary"></p>
    <div class="notes hidden" id="checkNotes">
      <h2>Worth a look in your pattern</h2>
      <ul id="checkNotesList"></ul>
    </div>
    <div id="checkList"></div>
    <button class="btn btn-primary" id="startBtn" type="button">Start knitting</button>
    <button class="btn btn-secondary" id="differentFileBtn" type="button">Choose a different file</button>
  </section>

  <!-- ============ TRACKER ============ -->
  <section id="tracker" class="hidden" aria-labelledby="trTitle">
    <div class="topbar">
      <h1 id="trTitle">Row Tracker</h1>
      <button class="btn-text" id="sectionsBtn" type="button">Sections</button>
    </div>
    <div class="sec-line" id="secLine"></div>

    <div class="swatch-wrap">
      <svg class="swatch" id="swatch" viewBox="0 0 320 60" role="img" aria-label="No rows finished yet"></svg>
      <button class="overall" id="overall" type="button" aria-label="Progress through the pattern. Open the list of sections."></button>
      <div class="overall-label"><span id="overallLeft"></span><span id="overallRight"></span></div>
    </div>

    <div class="rowcard" id="rowcard">
      <div class="row-num" id="rowNum"></div>
      <div class="pills hidden" id="pills"></div>
      <div class="row-text" id="rowText"></div>
      <ul class="checklist hidden" id="checklist"></ul>
      <div class="measure hidden" id="measureBox">
        <strong id="measureCount"></strong>
        <span id="measureEstimate"></span>
      </div>
      <div class="row-end hidden" id="rowEnd"></div>
      <div class="flag hidden" id="flagLine"></div>
    </div>

    <div class="stitches" id="stitchBox">
      <button class="stitch-minus" id="stMinus" type="button" aria-label="Take one stitch off the count">−</button>
      <button class="stitch-plus" id="stPlus" type="button">
        <span class="plus" aria-hidden="true">+1</span>
        <span class="stitch-text"><b id="stCount">0</b><span id="stLabel" aria-live="polite"></span></span>
      </button>
    </div>

    <div class="nav">
      <button class="btn btn-secondary back" id="backBtn" type="button">Back</button>
      <button class="btn btn-primary" id="nextBtn" type="button">Row done</button>
    </div>
    <button class="btn btn-secondary hidden" id="moveOnBtn" type="button"></button>
    <p class="upnext" id="upNext"></p>
    <p class="status hidden" id="trackerStatus" role="status"></p>

    <div class="footer">
      <button class="btn-text" id="wakeBtn" type="button" aria-pressed="false">Keep screen on</button>
      <button class="btn-text" id="infoBtn" type="button">Pattern info</button>
      <button class="btn-text" id="resetBtn" type="button">Start over</button>
    </div>
  </section>

  <noscript><p>Row Tracker needs JavaScript switched on in your browser.</p></noscript>
</main>

<!-- One pop-up sheet, used for Sections, Pattern info and the help text. -->
<div class="sheet-bg hidden" id="sheetBg">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1">
    <h2 id="sheetTitle"></h2>
    <div id="sheetBody"></div>
    <button class="btn btn-secondary" id="sheetClose" type="button">Close</button>
  </div>
</div>

<p class="sr-only" id="announce" aria-live="polite"></p>

<script type="module" src="./app.js"></script>
</body>
</html>
