# Runs each app's tests on every pull request.
name: Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node fishbowlapp/tests/run.mjs
      - run: node knittingapp/tests/run.mjs
